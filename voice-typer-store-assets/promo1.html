<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:800px; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#f5f5f7; color:#1a1a1a;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; }
  .logo { width:96px; height:96px; border-radius:22px; background:#4f46e5; display:flex; align-items:center; justify-content:center; margin-bottom:28px; box-shadow:0 12px 30px rgba(79,70,229,.3); }
  .logo svg { width:52px; height:52px; }
  h1 { font-size:58px; font-weight:800; letter-spacing:-1.5px; margin-bottom:16px; text-align:center; }
  h1 .accent { color:#4f46e5; }
  p.sub { font-size:24px; color:#6b6b6b; margin-bottom:56px; text-align:center; }
  .flow { display:flex; align-items:center; gap:22px; }
  .step { background:#fff; border:1px solid #e3e3e3; border-radius:18px; padding:28px 30px; width:270px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.05); }
  .step .ic { font-size:40px; margin-bottom:14px; }
  .step .t { font-size:21px; font-weight:700; margin-bottom:6px; }
  .step .d { font-size:15px; color:#6b6b6b; line-height:1.4; }
  .arrow { font-size:34px; color:#4f46e5; font-weight:800; }
</style></head><body>
  <div class="logo"><svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <rect x="9" y="3" width="4" height="9" rx="2" fill="#fff"/>
    <path d="M6 10a5 5 0 0 0 10 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="11" y1="15" x2="11" y2="18" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="14" y2="18" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </svg></div>
  <h1>Dictate anywhere in <span class="accent">Chrome</span></h1>
  <p class="sub">Press a shortcut, talk, and your words are typed in — instantly.</p>
  <div class="flow">
    <div class="step"><div class="ic">⌨️</div><div class="t">Press shortcut</div><div class="d">A beep means it's recording</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="ic">🎤</div><div class="t">Speak</div><div class="d">Say whatever you want to type</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="ic">✍️</div><div class="t">It types</div><div class="d">Text appears at your cursor</div></div>
  </div>
</body></html>
