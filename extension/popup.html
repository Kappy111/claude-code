<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snapfolder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>Screenshot Folders</span>
      </div>
      <button id="open-library" class="link-btn">View all</button>
    </header>

    <section class="capture-bar">
      <label class="field">
        <span class="field-label">Save to</span>
        <select id="folder-select" aria-label="Save to folder"></select>
      </label>

      <div class="capture-actions">
        <button id="capture-area" class="btn btn-primary">Capture area</button>
        <button id="capture-full" class="btn btn-secondary">Full tab</button>
      </div>
      <button id="capture-visible" class="btn btn-ghost btn-wide">
        Visible tab
      </button>
      <p class="hint">
        Drag to select an area. <kbd>Esc</kbd> cancels. Full tab:
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
      </p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2 class="panel-title">Folders</h2>
      <div class="add-row">
        <input id="new-folder-name" type="text" placeholder="New folder name" maxlength="60" />
        <button id="add-folder" class="btn btn-add">Add</button>
      </div>
      <ul id="folder-list" class="folder-list"></ul>
    </section>

    <section class="panel">
      <h2 class="panel-title">Recent</h2>
      <ul id="recent-list" class="recent-list"></ul>
      <p id="recent-empty" class="muted-line hidden">No screenshots yet.</p>
    </section>

    <footer class="app-footer">
      <span id="auth-label" class="muted-line">Not signed in</span>
      <button id="auth-btn" class="link-btn" disabled>Sign in (soon)</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
