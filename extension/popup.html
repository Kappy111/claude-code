<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snapfolder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>Screenshot Folders</span>
      </div>
      <button id="open-library" class="link-btn">View all</button>
    </header>

    <section class="capture-bar">
      <label class="field">
        <span class="field-label">Save to</span>
        <select id="folder-select" aria-label="Save to folder"></select>
      </label>

      <div class="capture-actions">
        <button id="capture-area" class="btn btn-primary">Capture area</button>
        <button id="capture-full" class="btn btn-secondary">Full tab</button>
      </div>
      <button id="capture-visible" class="btn btn-ghost btn-wide">
        Visible tab
      </button>
      <p class="hint">
        Drag to select an area. <kbd>Esc</kbd> cancels. Full tab:
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
      </p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2 class="panel-title">Folders</h2>
      <div class="add-row">
        <input id="new-folder-name" type="text" placeholder="New folder name" maxlength="60" />
        <button id="add-folder" class="btn btn-add">Add</button>
      </div>
      <ul id="folder-list" class="folder-list"></ul>
    </section>

    <section class="panel">
      <h2 class="panel-title">Recent</h2>
      <ul id="recent-list" class="recent-list"></ul>
      <p id="recent-empty" class="muted-line hidden">No screenshots yet.</p>
    </section>

    <footer class="app-footer">
      <!-- Signed-out: collapsed row -->
      <div id="auth-signedout" class="auth-row">
        <span class="muted-line">Not signed in</span>
        <button id="auth-show-form" class="link-btn">Sign in</button>
      </div>

      <!-- Signed-out: expandable form -->
      <form id="auth-form" class="auth-form hidden">
        <input id="auth-email" type="email" placeholder="Email" autocomplete="username" required />
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
        <div id="auth-error" class="auth-error hidden"></div>
        <div class="auth-actions">
          <button id="auth-signin" type="submit" class="btn btn-primary">Sign in</button>
          <button id="auth-signup" type="button" class="btn btn-secondary">Create account</button>
        </div>
        <button id="auth-cancel" type="button" class="link-btn auth-cancel">Cancel</button>
      </form>

      <!-- Signed-in -->
      <div id="auth-signedin" class="auth-row hidden">
        <span class="auth-user">Signed in as <strong id="auth-email-label"></strong></span>
        <button id="auth-signout" class="link-btn">Sign out</button>
      </div>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
