<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snapfolder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="22" height="22" />
        <span>Snapfolder</span>
      </div>
      <button id="open-library" class="link-btn" title="Open the full library">
        Library ↗
      </button>
    </header>

    <section class="capture-bar">
      <label class="field">
        <span class="field-label">Save to</span>
        <div class="folder-row">
          <select id="folder-select" aria-label="Folder"></select>
          <button id="new-folder" class="icon-btn" title="New folder">＋</button>
        </div>
      </label>

      <div class="capture-actions">
        <button id="capture-visible" class="btn btn-primary">
          📷 Capture visible
        </button>
        <button id="capture-full" class="btn btn-secondary" title="Scroll and stitch the whole page">
          🗎 Full page
        </button>
      </div>
      <p class="hint">
        Tip: press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> anywhere.
      </p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="gallery-section">
      <div class="gallery-head">
        <h2 id="gallery-title">Recent</h2>
        <span id="gallery-count" class="count"></span>
      </div>
      <div id="gallery" class="gallery"></div>
      <p id="empty" class="empty hidden">
        No screenshots in this folder yet. Capture one above.
      </p>
    </section>

    <footer class="app-footer">
      <div id="auth-area" class="auth-area">
        <span class="dot"></span>
        <span id="auth-label">Local only</span>
      </div>
      <button id="auth-btn" class="link-btn" disabled>Sign in</button>
    </footer>

    <!-- New folder dialog -->
    <dialog id="folder-dialog">
      <form method="dialog" class="dialog-form">
        <h3>New folder</h3>
        <input id="folder-name" type="text" placeholder="Folder name" maxlength="60" required />
        <div class="dialog-actions">
          <button value="cancel" class="btn btn-ghost">Cancel</button>
          <button id="folder-create" value="create" class="btn btn-primary">Create</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
