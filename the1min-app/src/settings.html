<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The1Min — Settings</title>
<style>
  :root{
    --bg:#ffffff;--surface:#f4f2f9;--ink:#1b1a27;--muted:#6a6782;--line:#ddd9e8;--amber:#e2832a;
    --f-display:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;--f-body:system-ui,-apple-system,sans-serif;
    --f-mono:ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#15141f;--surface:#262539;--ink:#f0eef8;--muted:#9d99b6;--line:#302f45;--amber:#f4a73f;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;padding:22px}
  h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0 0 2px}
  h1 b{color:var(--amber)}
  p.sub{color:var(--muted);margin:0 0 18px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input,select{width:100%;font-family:var(--f-body);font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px}
  input:focus,select:focus{outline:none;border-color:var(--amber)}
  .hint{color:var(--muted);font-size:.82rem;margin-top:6px}
  .hint code{font-family:var(--f-mono);background:var(--surface);padding:1px 5px;border-radius:5px}
  a{color:var(--amber)}
  .save{margin-top:22px;width:100%;font-family:var(--f-display);font-weight:700;font-size:1rem;border:none;border-radius:12px;padding:13px;background:var(--amber);color:#2a1603;cursor:pointer}
  .env{margin-top:10px;font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
  <h1>The<b>1Min</b> Settings</h1>
  <p class="sub">Your key is stored only on this computer and is used to ask Claude about your screen.</p>

  <label for="key">Anthropic API key</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
  <div class="hint">Get one at <a id="getkey" href="#">console.anthropic.com</a>. Starts with <code>sk-ant-</code>.</div>
  <div class="env" id="envNote"></div>

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-opus-5-5">Claude Opus 5.5 — most capable (default)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — balanced</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 — fastest & cheapest</option>
  </select>
  <div class="hint">Testing a lot? <b>Haiku 5.5</b> is quickest and costs the least per peek.</div>

  <button class="save" id="save">Save</button>

  <script src="settings.js"></script>
</body>
</html>
