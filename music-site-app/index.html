<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #121212; --bg-top: #1f1f1f; --row: #181818; --row-hover: #242424;
    --fg: #ffffff; --muted: #b3b3b3; --line: #2a2a2a;
    --accent: #1db954; --accent-hi: #1ed760; --accent-ink: #000000;
    --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-bottom: 72px; }

  /* Playlist header */
  .plhead {
    display: flex; gap: 20px; align-items: flex-end;
    padding: 40px max(16px, env(safe-area-inset-left)) 22px max(16px, env(safe-area-inset-right));
    background: linear-gradient(180deg, var(--bg-top), var(--bg));
  }
  .plcover {
    width: 150px; height: 150px; flex-shrink: 0; border-radius: 6px;
    background: linear-gradient(145deg, var(--accent), #1a6e3a 55%, #0d3b22);
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .plcover svg { width: 56px; height: 56px; opacity: .92; }
  .plinfo { min-width: 0; padding-bottom: 4px; }
  .pllabel { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg); }
  h1 { font-size: clamp(2rem, 9vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 10px; line-height: 1.05; }
  .plmeta { font-size: .86rem; color: var(--muted); }
  .plmeta b { color: var(--fg); font-weight: 600; }

  .body { padding: 8px max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }

  /* Track rows */
  .tracks { display: flex; flex-direction: column; }
  .row { border-radius: 8px; }
  .rowhead {
    display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; transition: background .15s; user-select: none;
  }
  .rowhead:hover { background: var(--row-hover); }
  .row.open .rowhead { background: var(--row-hover); }
  .num { width: 18px; text-align: right; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .thumb {
    position: relative; width: 48px; height: 48px; border-radius: 4px; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(145deg, #3a3a3a, #202020);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .pbadge {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); opacity: 0; transition: opacity .15s; color: #fff;
  }
  .rowhead:hover .pbadge, .row.open .pbadge { opacity: 1; }
  .meta { flex: 1; min-width: 0; }
  .t { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.open .t { color: var(--accent-hi); }
  .s { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--muted); flex-shrink: 0; transition: transform .2s; font-size: 1.1rem; }
  .row.open .chev { transform: rotate(180deg); color: var(--fg); }

  .player { padding: 4px 10px 16px 10px; }
  .playerbox { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .playerbox iframe { width: 100%; height: 240px; border: 0; display: block; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .pill {
    text-decoration: none; font-size: .8rem; font-weight: 600; padding: 7px 14px; border-radius: 500px;
    border: 1px solid var(--line); color: var(--fg); background: transparent; cursor: pointer;
  }
  .pill:hover { border-color: var(--fg); }
  .pill.green { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pill.green:hover { background: var(--accent-hi); transform: scale(1.02); }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty strong { color: var(--fg); }

  /* Owner panel */
  .owner { margin: 30px max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }
  .toggle { background: none; color: var(--muted); font-size: .85rem; font-family: inherit; text-decoration: underline; padding: 0; border: 0; cursor: pointer; }
  .panel { background: var(--row); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 12px; }
  .panel h2 { font-size: 1rem; margin: 0 0 14px; }
  label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 5px; }
  input[type=password], input[type=text], input[type=url], textarea {
    width: 100%; padding: 11px 13px; font-size: 1rem; font-family: inherit; color: var(--fg);
    background: #2a2a2a; border: 1px solid transparent; border-radius: 6px;
  }
  input:focus-visible, textarea:focus-visible { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; }
  .field { margin-bottom: 14px; }
  .btn { width: 100%; padding: 12px; font-size: .95rem; font-weight: 700; font-family: inherit; border: 0; border-radius: 500px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn:hover { background: var(--accent-hi); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .status { font-size: .85rem; margin-top: 10px; min-height: 1.2em; color: var(--muted); }
  .status.err { color: #ff6b6b; }
  .status.ok { color: var(--accent-hi); }
  .hint { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }
  .hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
  .hide { display: none !important; }

  @media (max-width: 520px) {
    .plhead { flex-direction: column; align-items: flex-start; gap: 16px; padding-top: 28px; }
    .plcover { width: 120px; height: 120px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="plhead">
    <div class="plcover" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#07301b"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <div class="plinfo">
      <div class="pllabel">Playlist</div>
      <h1>My Music</h1>
      <div class="plmeta" id="count">Loading…</div>
    </div>
  </div>

  <div class="body">
    <div class="tracks" id="tracks"></div>
  </div>

  <div class="owner">
    <button class="toggle" id="ownerToggle">Owner? Add or manage songs</button>
    <section class="panel hide" id="ownerPanel">
      <h2>Add a song</h2>
      <div class="field">
        <label for="pw">Your password</label>
        <input type="password" id="pw" placeholder="the password you set" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="link">Suno share link</label>
        <input type="url" id="link" placeholder="https://suno.com/s/...">
        <p class="hint">In Suno, tap <b>Share</b> on your song and copy the link.</p>
      </div>
      <div class="field">
        <label for="ttl">Song name (optional)</label>
        <input type="text" id="ttl" placeholder="leave blank to use Suno's title">
      </div>
      <button class="btn" id="addBtn">Add to my page</button>
      <div class="status" id="status"></div>

      <hr class="hr">
      <h2>Add several at once</h2>
      <div class="field">
        <label for="bulk">Paste many Suno links — one per line</label>
        <textarea id="bulk" rows="5" placeholder="https://suno.com/s/aaa: Song one&#10;https://suno.com/s/bbb: Song two"></textarea>
        <p class="hint">Optional: put a name after the link with a colon, e.g. <code>link: My Song</code>.</p>
      </div>
      <button class="btn" id="bulkBtn">Add all</button>
    </section>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var tracksEl = $('tracks'), countEl = $('count'), statusEl = $('status');

  try { var saved = localStorage.getItem('music-pw'); if (saved) $('pw').value = saved; } catch (e) {}

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

  var PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

  function loadSongs() {
    fetch('/api/list').then(function (r) { return r.json(); }).then(function (songs) {
      render(Array.isArray(songs) ? songs : []);
    }).catch(function () {
      countEl.textContent = '';
      tracksEl.innerHTML = '<div class="empty">Could not load songs. Refresh to try again.</div>';
    });
  }

  function render(songs) {
    tracksEl.innerHTML = '';
    if (!songs.length) {
      countEl.textContent = '';
      tracksEl.innerHTML = '<div class="empty"><strong>No songs yet.</strong><br>If you are the owner, add your first one below.</div>';
      return;
    }
    countEl.innerHTML = '<b>' + songs.length + '</b> ' + (songs.length === 1 ? 'song' : 'songs');
    var pw = $('pw').value.trim();
    songs.forEach(function (s, idx) {
      var row = document.createElement('div');
      row.className = 'row';
      var cover = 'https://cdn2.suno.ai/image_' + s.id + '.jpeg';
      row.innerHTML =
        '<div class="rowhead">' +
          '<div class="num">' + (idx + 1) + '</div>' +
          '<div class="thumb">' +
            '<img src="' + esc(cover) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' +
            '<span class="pbadge">' + PLAY + '</span>' +
          '</div>' +
          '<div class="meta"><div class="t">' + esc(s.title) + '</div><div class="s">Suno</div></div>' +
          '<div class="chev">⌄</div>' +
        '</div>' +
        '<div class="player hide">' +
          '<div class="playerbox"></div>' +
          '<div class="acts">' +
            '<a class="pill" href="' + esc(s.link) + '" target="_blank" rel="noopener">Open on Suno ↗</a>' +
            (pw ? '<button class="pill rm" data-id="' + esc(s.id) + '" data-title="' + esc(s.title) + '">Remove</button>' : '') +
          '</div>' +
        '</div>';
      row.setAttribute('data-id', s.id);
      row._song = s;
      tracksEl.appendChild(row);

      row.querySelector('.rowhead').addEventListener('click', function () { togglePlayer(row); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rm'), function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); removeSong(b.getAttribute('data-id'), b.getAttribute('data-title')); });
    });
  }

  function togglePlayer(row) {
    var open = row.classList.contains('open');
    // close others (one player at a time, like a now-playing bar)
    Array.prototype.forEach.call(document.querySelectorAll('.row.open'), function (r) {
      if (r !== row) {
        r.classList.remove('open');
        r.querySelector('.player').classList.add('hide');
        r.querySelector('.playerbox').innerHTML = '';
      }
    });
    var player = row.querySelector('.player');
    var box = row.querySelector('.playerbox');
    if (open) {
      row.classList.remove('open'); player.classList.add('hide'); box.innerHTML = '';
    } else {
      box.innerHTML = '<iframe loading="lazy" allow="autoplay; encrypted-media; clipboard-write" src="https://suno.com/embed/' + row.getAttribute('data-id') + '"></iframe>';
      player.classList.remove('hide'); row.classList.add('open');
    }
  }

  function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = 'status' + (kind ? ' ' + kind : ''); }

  function addSong() {
    var pw = $('pw').value.trim(), link = $('link').value.trim(), ttl = $('ttl').value.trim();
    if (!pw) { setStatus('Enter your password first.', 'err'); return; }
    if (!link) { setStatus('Paste a Suno link.', 'err'); return; }
    try { localStorage.setItem('music-pw', pw); } catch (e) {}
    $('addBtn').disabled = true;
    setStatus('Adding…');
    fetch('/api/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, link: link, title: ttl }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        $('addBtn').disabled = false;
        if (!res.ok) { setStatus(res.j.error || 'Could not add that link.', 'err'); return; }
        setStatus('Added!', 'ok');
        $('link').value = ''; $('ttl').value = '';
        loadSongs();
      }).catch(function () { $('addBtn').disabled = false; setStatus('Something went wrong. Try again.', 'err'); });
  }

  function removeSong(id, title) {
    var pw = $('pw').value.trim();
    if (!pw) { setStatus('Enter your password first.', 'err'); return; }
    if (!window.confirm('Remove "' + title + '"?')) return;
    setStatus('Removing…');
    fetch('/api/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id: id }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { setStatus(res.j.error || 'Could not remove.', 'err'); return; }
        setStatus('Removed.', 'ok'); loadSongs();
      }).catch(function () { setStatus('Could not remove.', 'err'); });
  }

  $('ownerToggle').addEventListener('click', function () { $('ownerPanel').classList.toggle('hide'); loadSongs(); });
  $('pw').addEventListener('change', loadSongs);
  $('addBtn').addEventListener('click', addSong);

  function bulkAdd() {
    var pw = $('pw').value.trim();
    if (!pw) { setStatus('Enter your password first.', 'err'); return; }
    var lines = $('bulk').value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
    var items = [];
    lines.forEach(function (line) {
      var m = line.match(/(https?:\/\/[^\s]*?suno\.(?:com|ai)\/[a-z]+\/[A-Za-z0-9_-]+)/i);
      if (!m) return;
      var url = m[1];
      var rest = line.slice(line.indexOf(url) + url.length).replace(/^[\s:,\|\-–—]+/, '').trim();
      items.push({ link: url, title: rest });
    });
    if (!items.length) { setStatus('No Suno links found in that text.', 'err'); return; }
    try { localStorage.setItem('music-pw', pw); } catch (e) {}
    $('bulkBtn').disabled = true; $('addBtn').disabled = true;
    var i = 0, ok = 0, fail = 0;
    function next() {
      if (i >= items.length) {
        $('bulkBtn').disabled = false; $('addBtn').disabled = false;
        setStatus('Added ' + ok + ' of ' + items.length + (fail ? ' (' + fail + ' failed)' : '') + '.', fail ? 'err' : 'ok');
        $('bulk').value = ''; loadSongs(); return;
      }
      var it = items[i]; i++;
      setStatus('Adding ' + i + ' of ' + items.length + '…');
      fetch('/api/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, link: it.link, title: it.title }) })
        .then(function (r) { return r.ok; })
        .then(function (okr) { if (okr) ok++; else fail++; next(); })
        .catch(function () { fail++; next(); });
    }
    next();
  }
  $('bulkBtn').addEventListener('click', bulkAdd);

  loadSongs();
</script>
</body>
</html>
