<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --fg: #1c1a17; --muted: #6b655c;
    --line: #e7e1d7; --accent: #e0562d; --accent-ink: #ffffff; --ok: #2e7d4f;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210; --surface: #1f1c19; --fg: #f3efe8; --muted: #a39b8e;
      --line: #322d28; --accent: #ff6b3d; --accent-ink: #1a0e08; --ok: #6bd49a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left)) 72px max(16px, env(safe-area-inset-right)); }
  header { margin-bottom: 24px; }
  h1 { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  .tagline { color: var(--muted); margin: 0; }
  h2 { font-family: var(--font-display); font-size: 1rem; margin: 0 0 14px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 24px; }
  label { display: block; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 5px; }
  input[type=password], input[type=text], input[type=url] { width: 100%; padding: 11px 13px; font-size: 1rem; font-family: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 14px; }
  button { font-family: var(--font-display); font-weight: 600; cursor: pointer; border: none; border-radius: 9px; }
  .btn { padding: 11px 16px; font-size: .95rem; background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-ghost { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 8px 13px; font-size: .82rem; text-decoration: none; display: inline-block; }
  .status { font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  .status.err { color: var(--accent); }
  .status.ok { color: var(--ok); }

  .count { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 14px; }
  .tracks { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .ttl { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 0 0 10px; overflow-wrap: anywhere; }
  .playerbox { position: relative; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .playerbox iframe { width: 100%; height: 240px; border: 0; display: block; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: 14px; }
  .toggle { background: none; color: var(--muted); font-size: .85rem; text-decoration: underline; padding: 0; margin-top: 4px; }
  .hide { display: none !important; }
  .hint { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Music</h1>
    <p class="tagline">Press play — straight from Suno.</p>
  </header>

  <p class="count" id="count">Loading…</p>
  <div class="tracks" id="tracks"></div>

  <div style="margin-top:28px">
    <button class="toggle" id="ownerToggle">Owner? Add or manage songs</button>
    <section class="panel hide" id="ownerPanel" style="margin-top:12px">
      <h2>Add a song</h2>
      <div class="field">
        <label for="pw">Your password</label>
        <input type="password" id="pw" placeholder="the password you set" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="link">Suno share link</label>
        <input type="url" id="link" placeholder="https://suno.com/s/... or https://suno.com/song/...">
        <p class="hint">In Suno, tap <b>Share</b> on your song and copy the link.</p>
      </div>
      <div class="field">
        <label for="ttl">Song name (optional)</label>
        <input type="text" id="ttl" placeholder="leave blank to use Suno's title">
      </div>
      <button class="btn" id="addBtn">Add to my page</button>
      <div class="status" id="status"></div>
    </section>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var tracksEl = $('tracks'), countEl = $('count'), statusEl = $('status');

  try { var saved = localStorage.getItem('music-pw'); if (saved) $('pw').value = saved; } catch (e) {}

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

  function loadSongs() {
    fetch('/api/list').then(function (r) { return r.json(); }).then(function (songs) {
      render(Array.isArray(songs) ? songs : []);
    }).catch(function () {
      countEl.textContent = '';
      tracksEl.innerHTML = '<div class="empty">Could not load songs. Refresh to try again.</div>';
    });
  }

  function render(songs) {
    tracksEl.innerHTML = '';
    if (!songs.length) {
      countEl.textContent = '';
      tracksEl.innerHTML = '<div class="empty"><strong>No songs yet.</strong><br>If you are the owner, add your first one below.</div>';
      return;
    }
    countEl.textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
    var pw = $('pw').value.trim();
    songs.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<p class="ttl">' + esc(s.title) + '</p>' +
        '<div class="playerbox"><iframe loading="lazy" allow="autoplay; encrypted-media; clipboard-write" src="https://suno.com/embed/' + esc(s.id) + '"></iframe></div>' +
        '<div class="acts">' +
          '<a class="btn-ghost" href="' + esc(s.link) + '" target="_blank" rel="noopener">Open on Suno ↗</a>' +
          (pw ? '<button class="btn-ghost rm" data-id="' + esc(s.id) + '" data-title="' + esc(s.title) + '">Remove</button>' : '') +
        '</div>';
      tracksEl.appendChild(card);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rm'), function (b) {
      b.addEventListener('click', function () { removeSong(b.getAttribute('data-id'), b.getAttribute('data-title')); });
    });
  }

  function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = 'status' + (kind ? ' ' + kind : ''); }

  function addSong() {
    var pw = $('pw').value.trim(), link = $('link').value.trim(), ttl = $('ttl').value.trim();
    if (!pw) { setStatus('Enter your password first.', 'err'); return; }
    if (!link) { setStatus('Paste a Suno link.', 'err'); return; }
    try { localStorage.setItem('music-pw', pw); } catch (e) {}
    $('addBtn').disabled = true;
    setStatus('Adding…');
    fetch('/api/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, link: link, title: ttl }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        $('addBtn').disabled = false;
        if (!res.ok) { setStatus(res.j.error || 'Could not add that link.', 'err'); return; }
        setStatus('Added!', 'ok');
        $('link').value = ''; $('ttl').value = '';
        loadSongs();
      }).catch(function () { $('addBtn').disabled = false; setStatus('Something went wrong. Try again.', 'err'); });
  }

  function removeSong(id, title) {
    var pw = $('pw').value.trim();
    if (!pw) { setStatus('Enter your password first.', 'err'); return; }
    if (!window.confirm('Remove "' + title + '"?')) return;
    setStatus('Removing…');
    fetch('/api/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id: id }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { setStatus(res.j.error || 'Could not remove.', 'err'); return; }
        setStatus('Removed.', 'ok'); loadSongs();
      }).catch(function () { setStatus('Could not remove.', 'err'); });
  }

  $('ownerToggle').addEventListener('click', function () { $('ownerPanel').classList.toggle('hide'); loadSongs(); });
  $('pw').addEventListener('change', loadSongs);
  $('addBtn').addEventListener('click', addSong);

  loadSongs();
</script>
</body>
</html>
